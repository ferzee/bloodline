plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

repositories {
	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
	// for more information about repositories.
}

// Automated tests that play through the mod's quests in a headless test world: ./gradlew runGametest
sourceSets {
	gametest {
		compileClasspath += main.compileClasspath + main.output
		runtimeClasspath += main.runtimeClasspath + main.output
	}
	// Opens Bloodline's own screens in the real game and takes screenshots: ./gradlew runClientGametest
	clientgametest
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"bloodline" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
		"bloodline-gametest" {
			sourceSet sourceSets.gametest
		}
		"bloodline-clientgametest" {
			sourceSet sourceSets.clientgametest
		}
	}

	runs {
		clientGametest {
			client()
			configName = "Client Game Tests"
			source sourceSets.clientgametest
			runDir = "build/clientgametest"
			programArgs "--username", "Fersy"
			vmArg "-Dfabric.client.gametest"
		}
		gametest {
			server()
			configName = "Game Tests"
			source sourceSets.gametest
			runDir = "build/gametest"
			vmArg "-Dfabric-api.gametest"
			vmArg "-Dfabric-api.gametest.report-file=${project.layout.buildDirectory.get().asFile}/gametest/report.xml"
		}
		// A fixed name gives the test client the same player ID every time, so a test world's family
		// is still yours after a restart (real accounts always keep their ID).
		client {
			programArgs "--username", "Fersy"
			// Open the game in a bigger window than Minecraft's default 854 x 480.
			programArgs "--width", "1600", "--height", "900"
		}
		// A second client with its own folder and name, for testing multiplayer on one computer:
		// open a world to LAN in one client and join it from the other.
		client2 {
			client()
			configName = "Minecraft Client (second player)"
			runDir = "run2"
			programArgs "--username", "Friend"
			programArgs "--width", "1280", "--height", "720"
		}
	}
}

// The client source set only exists once Loom has split the sources, so the client tests are wired up here.
sourceSets.clientgametest {
	compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output + sourceSets.client.compileClasspath + sourceSets.client.output
	runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output + sourceSets.client.runtimeClasspath + sourceSets.client.output
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}

// Every test run starts in a fresh world, so a crypt solved in one run doesn't carry over into the next.
tasks.matching { it.name == "runGametest" }.configureEach {
	def world = layout.buildDirectory.dir("gametest/world").get().asFile
	doFirst { world.deleteDir() }
}
